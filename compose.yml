name: ${COMPOSE_PROJECT_NAME}

services:
  traefik:
    build:
      context: ./traefik
    container_name: ${COMPOSE_PROJECT_NAME}-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml.tmpl:/etc/traefik/templates/traefik.yml.tmpl:ro
      - ./traefik/dynamic:/etc/traefik/templates/dynamic:ro
      - ./traefik/acme.json:/acme/acme.json
      - ./traefik/acme-staging.json:/acme/acme-staging.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ACME_EMAIL
      - TRAEFIK_HOST
      - TRAEFIK_TLS_RESOLVER
      - TRAEFIK_DASHBOARD_USER
      - TRAEFIK_DASHBOARD_PASSWORD_HASH
    networks:
      - proxy

  wp-db:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME}-wp-db
    restart: unless-stopped
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      - MARIADB_ROOT_PASSWORD=${WP_DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${WP_DB_NAME}
      - MARIADB_USER=${WP_DB_USER}
      - MARIADB_PASSWORD=${WP_DB_PASSWORD}
    volumes:
      - ./data/wp/db:/var/lib/mysql
    networks:
      - wp-net

  wp-php:
    build:
      context: ./wordpress
      args:
        - WP_VERSION=${WP_VERSION}
        - WP_PHP_VERSION=${WP_PHP_VERSION}
        - BUDDYPRESS_VERSION=${BUDDYPRESS_VERSION}
        - JITSI_SPARRING_REF=${JITSI_SPARRING_REF}
        - MEETING_REGISTRATION_REF=${MEETING_REGISTRATION_REF}
    container_name: ${COMPOSE_PROJECT_NAME}-wp-php
    restart: unless-stopped
    depends_on:
      - wp-db
    environment:
      - WORDPRESS_DB_HOST=wp-db
      - WORDPRESS_DB_NAME=${WP_DB_NAME}
      - WORDPRESS_DB_USER=${WP_DB_USER}
      - WORDPRESS_DB_PASSWORD=${WP_DB_PASSWORD}
      - WP_HOST
      - WP_TITLE
      - WP_ADMIN_USER
      - WP_ADMIN_PASS
      - WP_ADMIN_EMAIL
      - WP_MENU_HOME_LABEL
      - WP_MENU_MEETUPS_LABEL
      - WP_MENU_MEMBERS_LABEL
      - JITSI_HOST
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASS
      - SMTP_FROM_EMAIL
      - SMTP_FROM_NAME
      - SMTP_ENCRYPTION
      - COPAI_RUN_INSTALL=1
    volumes:
      - wp-html:/var/www/html
      - ./data/wp/content:/var/www/html/wp-content
    networks:
      - wp-net

  wp-nginx:
    build:
      context: ./wordpress
      dockerfile: Dockerfile.nginx
    container_name: ${COMPOSE_PROJECT_NAME}-wp-nginx
    restart: unless-stopped
    depends_on:
      - wp-php
    environment:
      - WP_MAX_UPLOAD
    volumes:
      - wp-html:/var/www/html:ro
      - ./data/wp/content:/var/www/html/wp-content:ro
    networks:
      - wp-net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.services.wp.loadbalancer.server.port=80"
      - "traefik.http.routers.wp.rule=Host(`${WP_HOST}`)"
      - "traefik.http.routers.wp.entrypoints=websecure"
      - "traefik.http.routers.wp.tls.certresolver=${TRAEFIK_TLS_RESOLVER}"

  wp-cron:
    build:
      context: ./wordpress
      args:
        - WP_VERSION=${WP_VERSION}
        - WP_PHP_VERSION=${WP_PHP_VERSION}
        - BUDDYPRESS_VERSION=${BUDDYPRESS_VERSION}
        - JITSI_SPARRING_REF=${JITSI_SPARRING_REF}
        - MEETING_REGISTRATION_REF=${MEETING_REGISTRATION_REF}
    container_name: ${COMPOSE_PROJECT_NAME}-wp-cron
    restart: unless-stopped
    depends_on:
      - wp-php
    environment:
      - WORDPRESS_DB_HOST=wp-db
      - WORDPRESS_DB_NAME=${WP_DB_NAME}
      - WORDPRESS_DB_USER=${WP_DB_USER}
      - WORDPRESS_DB_PASSWORD=${WP_DB_PASSWORD}
    volumes:
      - wp-html:/var/www/html
      - ./data/wp/content:/var/www/html/wp-content
    networks:
      - wp-net
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        until wp --allow-root --path=/var/www/html core is-installed 2>/dev/null;
        do sleep 5; done;
        while true; do
          wp --allow-root --path=/var/www/html cron event run --due-now;
          sleep 60;
        done

  jitsi-prosody:
    image: jitsi/prosody:${JITSI_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-jitsi-prosody
    restart: unless-stopped
    expose:
      - "5222"
      - "5347"
      - "5280"
    volumes:
      - ./data/jitsi/prosody-config:/config
      - ./data/jitsi/prosody-plugins:/prosody-plugins-custom
    environment:
      - AUTH_TYPE=internal
      - ENABLE_GUESTS=1
      - DOMAIN=meet.jitsi
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JICOFO_COMPONENT_SECRET=${JITSI_JICOFO_COMPONENT_SECRET}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JITSI_JICOFO_AUTH_PASSWORD}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JITSI_JVB_AUTH_PASSWORD}
      - TZ=${TZ}
    networks:
      jitsi-net:
        aliases:
          - meet.jitsi
          - auth.meet.jitsi
          - guest.meet.jitsi
          - muc.meet.jitsi
          - internal-muc.meet.jitsi

  jitsi-jicofo:
    image: jitsi/jicofo:${JITSI_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-jitsi-jicofo
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    volumes:
      - ./data/jitsi/jicofo:/config
    environment:
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JICOFO_COMPONENT_SECRET=${JITSI_JICOFO_COMPONENT_SECRET}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JITSI_JICOFO_AUTH_PASSWORD}
      - JVB_BREWERY_MUC=jvbbrewery
      - TZ=${TZ}
    networks:
      - jitsi-net

  jitsi-jvb:
    image: jitsi/jvb:${JITSI_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-jitsi-jvb
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    ports:
      - "10000:10000/udp"
    volumes:
      - ./data/jitsi/jvb:/config
    environment:
      - DOCKER_HOST_ADDRESS=${JITSI_JVB_ADVERTISE_IPS}
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JITSI_JVB_AUTH_PASSWORD}
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=10000
      - JVB_ADVERTISE_IPS=${JITSI_JVB_ADVERTISE_IPS}
      - JVB_STUN_SERVERS=meet-jit-si-turnrelay.jitsi.net:443
      - TZ=${TZ}
    networks:
      - jitsi-net

  jitsi-web:
    image: jitsi/web:${JITSI_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-jitsi-web
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    volumes:
      - ./data/jitsi/web:/config
      - ./data/jitsi/transcripts:/usr/share/jitsi-meet/transcripts
    environment:
      - ENABLE_AUTH=0
      - ENABLE_GUESTS=1
      - PUBLIC_URL=https://${JITSI_HOST}
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
      - DISABLE_HTTPS=1
      - TZ=${TZ}
    networks:
      - jitsi-net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.services.jitsi.loadbalancer.server.port=80"
      - "traefik.http.routers.jitsi.rule=Host(`${JITSI_HOST}`)"
      - "traefik.http.routers.jitsi.entrypoints=websecure"
      - "traefik.http.routers.jitsi.tls.certresolver=${TRAEFIK_TLS_RESOLVER}"

  moodle-db:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME}-moodle-db
    restart: unless-stopped
    command:
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
      - --skip-character-set-client-handshake
      - --init-connect=SET NAMES utf8mb4
    environment:
      - MARIADB_ROOT_PASSWORD=${MOODLE_DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MOODLE_DB_NAME}
      - MARIADB_USER=${MOODLE_DB_USER}
      - MARIADB_PASSWORD=${MOODLE_DB_PASSWORD}
    volumes:
      - ./data/moodle/db:/var/lib/mysql
    networks:
      - moodle-net

  moodle-php:
    build:
      context: ./moodle
      args:
        - MOODLE_GIT_BRANCH=${MOODLE_GIT_BRANCH}
    container_name: ${COMPOSE_PROJECT_NAME}-moodle-php
    restart: unless-stopped
    depends_on:
      - moodle-db
    environment:
      - MOODLE_DB_HOST=moodle-db
      - MOODLE_DB_NAME=${MOODLE_DB_NAME}
      - MOODLE_DB_USER=${MOODLE_DB_USER}
      - MOODLE_DB_PASSWORD=${MOODLE_DB_PASSWORD}
      - MOODLE_URL=https://${MOODLE_HOST}
      - MOODLE_ADMIN_USER=${MOODLE_ADMIN_USER}
      - MOODLE_ADMIN_PASS=${MOODLE_ADMIN_PASS}
      - MOODLE_ADMIN_EMAIL=${MOODLE_ADMIN_EMAIL}
      - MOODLE_MAX_UPLOAD=${MOODLE_MAX_UPLOAD}
      - SSL=true
    volumes:
      - ./moodle/config.php:/var/www/html/config.php
      - ./data/moodle/moodledata:/var/www/moodledata
    networks:
      - moodle-net

  moodle-nginx:
    build:
      context: ./moodle
      dockerfile: Dockerfile.nginx
      args:
        - MOODLE_GIT_BRANCH=${MOODLE_GIT_BRANCH}
    container_name: ${COMPOSE_PROJECT_NAME}-moodle-nginx
    restart: unless-stopped
    depends_on:
      - moodle-php
    environment:
      - MOODLE_MAX_UPLOAD=${MOODLE_MAX_UPLOAD}
    volumes:
      - ./data/moodle/moodledata:/var/www/moodledata
    networks:
      - moodle-net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.services.moodle.loadbalancer.server.port=80"
      - "traefik.http.routers.moodle.rule=Host(`${MOODLE_HOST}`)"
      - "traefik.http.routers.moodle.entrypoints=websecure"
      - "traefik.http.routers.moodle.tls.certresolver=${TRAEFIK_TLS_RESOLVER}"

  moodle-cron:
    build:
      context: ./moodle
      args:
        - MOODLE_GIT_BRANCH=${MOODLE_GIT_BRANCH}
    container_name: ${COMPOSE_PROJECT_NAME}-moodle-cron
    restart: unless-stopped
    depends_on:
      - moodle-db
      - moodle-php
    entrypoint: []
    command:
      - bash
      - -c
      - >-
        echo 'Starting Moodle cron loop...';
        while true; do
          php /var/www/html/admin/cli/cron.php > /dev/null 2>&1 || true;
          sleep 60;
        done
    environment:
      - MOODLE_DB_HOST=moodle-db
      - MOODLE_DB_NAME=${MOODLE_DB_NAME}
      - MOODLE_DB_USER=${MOODLE_DB_USER}
      - MOODLE_DB_PASSWORD=${MOODLE_DB_PASSWORD}
      - MOODLE_URL=https://${MOODLE_HOST}
    volumes:
      - ./moodle/config.php:/var/www/html/config.php
      - ./data/moodle/moodledata:/var/www/moodledata
    networks:
      - moodle-net

networks:
  proxy:
    name: ${TRAEFIK_NETWORK}
    external: true
  wp-net:
    name: ${COMPOSE_PROJECT_NAME}-wp-net
  moodle-net:
    name: ${COMPOSE_PROJECT_NAME}-moodle-net
  jitsi-net:
    name: ${COMPOSE_PROJECT_NAME}-jitsi-net

volumes:
  wp-html:
    name: ${COMPOSE_PROJECT_NAME}-wp-html
