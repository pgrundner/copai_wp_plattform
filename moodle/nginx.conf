server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    client_max_body_size ${MOODLE_MAX_UPLOAD};

    # WICHTIG: Das ist der Pfad IM Container
    root /var/www/html;
    index index.php index.html index.htm;

    # Logs umleiten (optional, aber gut für Docker logs)
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # 1. Statische Dateien (Bilder, JS, CSS)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. PHP Verarbeitung
    location ~ [^/]\.php(/|$) {
        # Split Pfad für Moodle (Slash Arguments)
        fastcgi_split_path_info  ^(.+\.php)(/.+)$;

        # Wenn Datei nicht da -> 404
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }

        # WICHTIG: Hier verbinden wir uns zum PHP Container!
        # "php" ist der Name des Services in der docker-compose.yml
        # "9000" ist der interne Port von PHP-FPM
        fastcgi_pass moodle-php:9000;
        
        fastcgi_index index.php;
        include fastcgi_params;
        
        # Parameter weitergeben
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Buffer erhöhen (Moodle braucht das oft für große Header)
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300; 
    }
}